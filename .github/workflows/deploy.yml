name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    name: Executar Testes (CI)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          
      - name: Rodar Pytest
        run: python -m pytest -q

  deploy:
    name: Build e Deploy (CD)
    needs: test
    # Só executa o deploy quando o código for mesclado (merge) na main
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Login no GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extrair Metadados do Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: type=sha,format=long

      - name: Build e Push da Imagem
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Deploy na EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # Autenticar a EC2 no GHCR usando o token automático do GitHub
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            
            # Definir a imagem com a tag do commit atual e garantir minúsculas
            IMAGE_TAG=ghcr.io/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
            IMAGE_TAG=$(echo "$IMAGE_TAG" | tr '[:upper:]' '[:lower:]')
            
            # Parar e remover o contêiner antigo, se existir
            docker stop cloud-api-container || true
            docker rm cloud-api-container || true
            
            # Baixar a nova imagem do repositório
            docker pull $IMAGE_TAG
            
            # Rodar o novo contêiner mapeando a porta 80 e persistindo o banco de dados
            docker run -d \
              --name cloud-api-container \
              --restart unless-stopped \
              -p 80:8080 \
              -v task_data:/data \
              $IMAGE_TAG